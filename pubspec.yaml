name: gebeta
description: "Gebeta Online — play the traditional Ethiopian mancala game. ገበጣ ጨዋታ."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + navigation
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0

  # Firebase — Spark (free) plan: Auth + Realtime Database + Hosting.
  # No Cloud Functions: they require a billing account, and this project
  # is free-tier only. Move validation lives client-side (see
  # lib/features/multiplayer/domain/move_validator.dart).
  firebase_core: ^4.1.0
  firebase_auth: ^6.1.0
  firebase_database: ^12.0.0

  # Local persistence (stats, settings, tutorial-seen flag)
  shared_preferences: ^2.3.0

  # Monetization — Android only; never initialised on web.
  google_mobile_ads: ^9.1.0

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Amharic needs a real Ethiopic face; system fonts are uneven across
    # Android OEMs and the web. Bundled (not google_fonts) so first run
    # works offline.
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansEthiopic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansEthiopic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
